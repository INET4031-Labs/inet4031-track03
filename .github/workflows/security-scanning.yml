name: Security Scanning Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: localhost:5000
  IMAGE_NAME: incident-app
  IMAGE_TAG: latest

jobs:
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scan-status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks analysis

      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks-action/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run gitleaks secrets detection
        id: gitleaks
        run: |
          # Week 12: advisory mode (exit code 0)
          # Week 13+: blocking mode (exit code 1)
          echo "Running gitleaks in advisory mode (Week 11-12)"
          gitleaks detect --source . --verbose || true

          echo "scan_completed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: .gitleaks*
          retention-days: 30

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: secrets-detection
    permissions:
      contents: read
    outputs:
      sbom-status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build application container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          which grype
          grype --version

      - name: Generate SBOM with Grype
        id: grype-scan
        run: |
          echo "Generating SBOM for container image..."
          grype ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o json > sbom-report.json || true
          grype ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o table > sbom-report.txt || true

          echo "=== SBOM Report (Table Format) ==="
          cat sbom-report.txt

          echo "sbom_generated=true" >> $GITHUB_OUTPUT

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sbom-report
          path: |
            sbom-report.json
            sbom-report.txt
          retention-days: 30

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sbom-generation
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build application container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          which grype
          grype --version

      - name: Scan for CRITICAL vulnerabilities
        id: critical-vuln-scan
        run: |
          echo "Scanning for CRITICAL vulnerabilities..."

          # Week 11-12: Advisory mode (do not fail)
          # Week 13+: Blocking mode (fail on CRITICAL)
          echo "Running Grype in advisory mode (Week 11-12)"
          grype ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --fail-on critical -o json > vulnerability-report.json || true

          grype ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o table > vulnerability-report.txt || true

          echo "=== Vulnerability Report ==="
          cat vulnerability-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: vulnerability-report
          path: |
            vulnerability-report.json
            vulnerability-report.txt
          retention-days: 30

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [secrets-detection, sbom-generation, vulnerability-scan]
    steps:
      - name: Download all scan reports
        uses: actions/download-artifact@v3
        with:
          path: scan-reports

      - name: Generate summary
        run: |
          echo "# Security Scanning Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets Detection:** ${{ needs.secrets-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM Generation:** ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vulnerability Scan:** ${{ needs.vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Week-by-Week Escalation" >> $GITHUB_STEP_SUMMARY
          echo "- **Week 11-12:** All scans advisory (report findings, do not block)" >> $GITHUB_STEP_SUMMARY
          echo "- **Week 13:** Secrets detection becomes blocking" >> $GITHUB_STEP_SUMMARY
          echo "- **Week 14:** Vulnerability (CRITICAL) detection becomes blocking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available in workflow run." >> $GITHUB_STEP_SUMMARY
